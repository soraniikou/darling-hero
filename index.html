<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Darling Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kurenaido&family=Pinyon+Script&family=Great+Vibes&family=Allura&family=Noto+Serif+JP:wght@200;300;500&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #050508;
    --text: #e8e8f0;
    /* 単語間 ≈1スペース幅を基準に 1.3 倍（flex gap） */
    --hero-msg-space-ref: 0.28em;
    --hero-msg-word-gap: calc(var(--hero-msg-space-ref) * 1.3);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--black);
    color: var(--text);
    font-family: 'Zen Kurenaido', sans-serif;
    min-height: 100vh;
    overflow: hidden;
    cursor: default;
    touch-action: manipulation;
  }

  canvas#bg {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: -1;
  }

  canvas#laserCanvas {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 100;
    mix-blend-mode: screen;
  }

  .app {
    position: relative;
    z-index: 10;
    min-height: 100vh;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1.2s ease;
  }
  .app.app-visible {
    opacity: 1;
    pointer-events: auto;
  }
  .app:not(.app-visible) * {
    pointer-events: none !important;
  }
  .app.app-visible * { pointer-events: auto; }

  .welcome-screen {
    position: fixed;
    inset: 0;
    z-index: 400;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--black);
    transition: opacity 1.2s ease, visibility 1.2s ease;
  }
  .welcome-screen.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .welcome-inner {
    text-align: center;
    max-width: 560px;
    width: calc(100% - 40px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  .welcome-title {
    font-family: 'Great Vibes', 'Allura', 'Pinyon Script', cursive;
    font-size: clamp(2.24rem, 6vw, 3.52rem);
    font-weight: 400;
    letter-spacing: 0.03em;
    color: rgba(255, 220, 130, 0.95);
    text-shadow: 0 0 24px rgba(255, 216, 107, 0.55), 0 0 50px rgba(255, 143, 163, 0.3);
    line-height: 1.1;
  }
  .welcome-prompt {
    font-family: 'Zen Kurenaido', sans-serif;
    font-size: 1.05rem;
    color: rgba(232, 232, 240, 0.88);
    letter-spacing: 0.02em;
  }
  @keyframes nameBreath {
    0%, 100% {
      border-color: rgba(135, 205, 90, 0.1);
      box-shadow: none;
    }
    50% {
      border-color: rgba(135, 205, 90, 0.58);
      box-shadow: 0 0 14px rgba(135, 205, 90, 0.18);
    }
  }
  .name-input {
    width: 100%;
    max-width: 480px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(135, 205, 90, 0.1);
    color: var(--text);
    font-family: 'Zen Kurenaido', sans-serif;
    font-size: 1rem;
    padding: 10px 14px;
    height: 52px;
    line-height: 1.4;
    outline: none;
    transition: border-color 0.3s, box-shadow 0.3s, opacity 0.3s;
    backdrop-filter: blur(4px);
    animation: nameBreath 2.8s ease-in-out infinite;
  }
  .name-input:focus {
    border-color: rgba(135, 205, 90, 0.65);
    box-shadow: 0 0 20px rgba(135, 205, 90, 0.22);
    animation: none;
  }
  .name-input::placeholder {
    color: rgba(200,200,220,0.55);
  }
  .begin-btn {
    margin-top: 8px;
    padding: 10px 29px;
    font-family: 'Pinyon Script', 'Great Vibes', cursive;
    font-size: 1.2rem;
    font-weight: 400;
    color: #1a1a2a;
    border: none;
    cursor: pointer;
    background: linear-gradient(135deg, #ffd86b 0%, #ff8fa3 50%, #7ee8fa 100%);
    box-shadow: 0 0 24px rgba(255, 216, 107, 0.35);
    transition: transform 0.3s, filter 0.3s, opacity 0.3s;
    display: inline-flex;
    align-items: center;
    gap: 0.3em;
  }
  .begin-btn .begin-note {
    font-size: 1.05em;
    font-weight: 400;
  }
  .begin-btn .begin-mic {
    font-family: sans-serif;
    font-size: 0.9em;
    line-height: 1;
  }
  .begin-btn:hover {
    transform: scale(1.04);
    filter: brightness(1.12);
  }
  .begin-btn:active {
    transform: scale(0.98);
  }

  .title-wrap {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    text-align: center;
    pointer-events: none;
    opacity: 1;
    visibility: visible;
    transition: opacity 0.35s ease, visibility 0.35s ease;
  }
  .title-wrap.is-hidden {
    opacity: 0;
    visibility: hidden;
  }

  h1 {
    font-family: 'Great Vibes', 'Allura', 'Pinyon Script', cursive;
    font-size: clamp(2.24rem, 6vw, 3.52rem);
    font-weight: 400;
    letter-spacing: 0.03em;
    color: rgba(255, 220, 130, 0.95);
    text-shadow: 0 0 24px rgba(255, 216, 107, 0.55), 0 0 50px rgba(255, 143, 163, 0.3);
    line-height: 1.1;
  }

  .title-wrap h1 {
    font-size: clamp(1.344rem, 3.6vw, 2.112rem);
    color: rgba(100, 162, 58, 0.90);
    text-shadow: 0 0 18px rgba(100, 162, 58, 0.45), 0 0 38px rgba(72, 138, 38, 0.22);
  }

  .input-row {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, calc(-50% - 60px));
    display: flex;
    align-items: center;
    gap: 12px;
    max-width: 560px;
    width: calc(100% - 40px);
    z-index: 50;
    opacity: 1;
    transition: opacity 3s ease;
  }
  .input-row.input-row--hidden {
    opacity: 0;
    pointer-events: none !important;
    transition: opacity 0.3s ease;
  }

  .input-with-arrow {
    display: flex;
    align-items: center;
    flex: 1;
    min-width: 0;
    gap: 10px;
  }

  .input-arrow {
    color: rgba(255, 216, 107, 0.85);
    font-size: 1.3rem;
    flex-shrink: 0;
    text-shadow: 0 0 14px rgba(255, 216, 107, 0.5);
    line-height: 1;
  }
  .input-arrow.input-arrow--hidden-cinematic {
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease, visibility 0.35s ease;
  }

  textarea {
    flex: 1;
    min-width: 0;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255, 216, 107, 0.2);
    color: var(--text);
    font-family: 'Zen Kurenaido', sans-serif;
    font-size: 1rem;
    padding: 10px 14px;
    resize: none;
    height: 52px;
    line-height: 1.4;
    outline: none;
    transition: border-color 0.3s, box-shadow 0.3s, opacity 0.3s;
    backdrop-filter: blur(4px);
    overflow: hidden;
  }
  textarea::-webkit-scrollbar { display: none !important; }
  textarea { -ms-overflow-style: none; scrollbar-width: none; }
  textarea:focus {
    border-color: rgba(255, 216, 107, 0.5);
    box-shadow: 0 0 20px rgba(255, 216, 107, 0.15);
  }
  textarea::placeholder { color: rgba(200,200,220,0.55); }
  textarea:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    background: rgba(255,255,255,0.02);
  }

  .release-btn {
    width: 100px;
    height: 100px;
    min-width: 100px;
    border: none;
    cursor: pointer;
    position: relative;
    background: linear-gradient(135deg, #ffd86b 0%, #ff8fa3 50%, #7ee8fa 100%);
    clip-path: polygon(50% 0%, 100% 100%, 0 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 18px;
    gap: 2px;
    color: #1a1a2a;
    font-family: 'Pinyon Script', 'Great Vibes', cursive;
    font-size: 1.35rem;
    font-weight: 400;
    transition: transform 0.3s, filter 0.3s, opacity 0.3s;
    box-shadow: 0 0 30px rgba(255, 216, 107, 0.3);
  }
  .release-btn .btn-mark {
    font-family: sans-serif;
    font-size: 1.4em;
    line-height: 1;
    display: none;
  }
  .release-btn:hover {
    transform: scale(1.05);
    filter: brightness(1.15);
  }
  .release-btn:active { transform: scale(0.96); }
  .release-btn:disabled {
    opacity: 0.45;
    cursor: default;
    pointer-events: none;
  }
  .release-btn.release-btn--hidden-cinematic {
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.45s ease, visibility 0.45s ease;
  }

  .spotlight-glow {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 700px;
    height: 700px;
    transform: translate(-50%, -50%) scale(0);
    border-radius: 50%;
    pointer-events: none;
    z-index: 99;
    filter: blur(25px);
    transition: transform 1.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s ease, background 0.8s ease;
    opacity: 0;
  }
  .spotlight-glow.show {
    transform: translate(-50%, -50%) scale(1.1);
    opacity: 1;
  }

  .burst-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 150;
  }
  .burst-char {
    position: fixed;
    font-family: 'Zen Kurenaido', sans-serif;
    font-size: 2.24rem;
    font-weight: bold;
    white-space: nowrap;
    will-change: transform, opacity;
  }

  /* 相の名前（英語、画面右上） */
  .phase-name {
    position: fixed;
    top: 24px;
    right: 28px;
    font-family: 'Great Vibes', 'Allura', cursive;
    font-size: clamp(1.12rem, 2.8vw, 1.54rem);
    font-weight: 400;
    color: rgba(255, 255, 255, 0.85);
    letter-spacing: 0.08em;
    opacity: 0;
    transition: opacity 1.4s ease, transform 1.4s ease;
    transform: translateY(-10px);
    pointer-events: none;
    z-index: 200;
    text-shadow: 0 0 22px currentColor;
    filter: blur(0.7px);
  }
  .phase-name.show {
    opacity: 0.92;
    transform: translateY(0);
  }
  .phase-name--sorrow {
    top: auto;
    bottom: 32px;
    right: 28px;
  }

  /* 最後の一行：Hero Line（筆記体・単語間）— スマホ既定 2×、PC は下の media */
  .hero-line {
    position: fixed;
    bottom: 120px;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    display: inline-flex;
    flex-wrap: nowrap;
    align-items: baseline;
    justify-content: center;
    gap: var(--hero-msg-word-gap);
    max-width: 96vw;
    font-family: 'Great Vibes', 'Allura', cursive;
    font-size: clamp(1.792rem, 4.48vw, 2.816rem);
    font-weight: 400;
    color: transparent;
    letter-spacing: 0.02em;
    white-space: nowrap;
    pointer-events: none;
    z-index: 250;
    opacity: 0;
    transition: transform 2s ease, opacity 2s ease;
    text-align: center;
  }
  .hero-line.hero-line--stacked {
    flex-direction: column;
    flex-wrap: nowrap;
    align-items: center;
    gap: 0.12em;
    white-space: normal;
  }
  .hero-line-row {
    display: inline-flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: center;
    gap: var(--hero-msg-word-gap);
    max-width: min(96vw, 100%);
  }
  .hero-line.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .hero-line .hero-line-word {
    display: inline-block;
    opacity: 0;
    font-family: inherit;
    font-weight: inherit;
    color: rgba(255, 245, 220, 0.95);
    text-shadow: 0 0 24px rgba(255, 216, 107, 0.6), 0 0 50px rgba(255, 200, 150, 0.3);
    transition: opacity 0.38s ease;
  }
  .hero-line .hero-line-word.is-visible {
    opacity: 1;
  }
  .hero-line .hero-line-word--name {
    vertical-align: baseline;
    font-size: 0.7em;
  }
  /* Loneliness 専用：2倍サイズ・折り返し許可 */
  .hero-line--large {
    font-size: clamp(3.584rem, 8.96vw, 5.632rem);
    white-space: normal;
    flex-wrap: wrap;
    text-align: center;
  }
  /* Loneliness 専用：紺色（紫・月の背景でも視認できる） */
  .hero-line--loneliness-navy .hero-line-word {
    color: rgba(175, 198, 255, 0.97);
    text-shadow:
      0 0 3px rgba(255, 255, 255, 0.55),
      0 0 18px rgba(100, 140, 230, 0.75),
      0 0 40px rgba(50, 80, 180, 0.45);
  }
  .hero-farewell--loneliness-navy .farewell-word {
    color: rgba(175, 198, 255, 0.86);
    text-shadow:
      0 0 2px rgba(255, 255, 255, 0.45),
      0 0 14px rgba(100, 140, 230, 0.65),
      0 0 30px rgba(50, 80, 180, 0.32);
  }
  /* Sorrow 専用：紺色テキスト */
  .hero-line--navy .hero-line-word {
    color: rgba(120, 175, 255, 0.95);
    text-shadow: 0 0 22px rgba(80, 140, 255, 0.7), 0 0 44px rgba(60, 100, 220, 0.35);
  }
  .hero-farewell--navy .farewell-word {
    color: rgba(120, 175, 255, 0.82);
    text-shadow: 0 0 16px rgba(80, 140, 255, 0.6), 0 0 32px rgba(60, 100, 220, 0.28);
  }
  /* Weariness 専用：小鳥と同じ緑 */
  .hero-line--green .hero-line-word {
    color: rgba(90, 170, 100, 0.95);
    text-shadow: 0 0 22px rgba(60, 140, 70, 0.7), 0 0 44px rgba(40, 110, 50, 0.35);
  }
  .hero-farewell--green .farewell-word {
    color: rgba(90, 170, 100, 0.82);
    text-shadow: 0 0 16px rgba(60, 140, 70, 0.6), 0 0 32px rgba(40, 110, 50, 0.28);
  }
  /* Love 専用：濃いピンク */
  .hero-line--pink .hero-line-word {
    color: rgba(220, 60, 120, 0.95);
    text-shadow: 0 0 22px rgba(220, 60, 120, 0.7), 0 0 44px rgba(180, 30, 90, 0.35);
  }
  .hero-farewell--pink .farewell-word {
    color: rgba(220, 60, 120, 0.82);
    text-shadow: 0 0 16px rgba(220, 60, 120, 0.6), 0 0 32px rgba(180, 30, 90, 0.28);
  }
  /* Gratitude 専用：濃い青 */
  .hero-line--dark-blue .hero-line-word {
    color: rgba(35, 65, 155, 0.96);
    text-shadow: 0 0 22px rgba(50, 90, 200, 0.65), 0 0 44px rgba(30, 55, 140, 0.35);
  }
  .hero-farewell--dark-blue .farewell-word {
    color: rgba(35, 65, 155, 0.84);
    text-shadow: 0 0 16px rgba(50, 90, 200, 0.55), 0 0 32px rgba(30, 55, 140, 0.28);
  }

  /* ラストメッセージ — スマホ既定 2×、PC は下の media */
  .hero-farewell {
    position: fixed;
    bottom: 72px;
    left: 50%;
    transform: translateX(-50%);
    display: inline-flex;
    flex-wrap: nowrap;
    align-items: baseline;
    justify-content: center;
    gap: calc(var(--hero-msg-word-gap) * 1.4);
    max-width: 96vw;
    font-family: 'Great Vibes', 'Allura', cursive;
    font-size: clamp(1.926rem, 4.816vw, 3.027rem);
    font-weight: 400;
    color: transparent;
    letter-spacing: 0.02em;
    white-space: nowrap;
    pointer-events: none;
    z-index: 250;
    text-align: center;
    opacity: 0;
  }
  .hero-farewell .farewell-word {
    display: inline-block;
    opacity: 0;
    font-family: inherit;
    font-weight: inherit;
    color: rgba(255, 245, 220, 0.7);
    text-shadow: 0 0 18px rgba(255, 216, 107, 0.45), 0 0 36px rgba(255, 200, 150, 0.22);
    transition: opacity 0.28s ease;
  }
  .hero-farewell .farewell-word.is-visible {
    opacity: 1;
  }

  @media (min-width: 641px) {
    .welcome-prompt {
      font-size: 1.47rem;
    }
    .name-input {
      font-size: 1.4rem;
    }
    .hero-line {
      font-size: clamp(1.254rem, 3.136vw, 1.971rem);
    }
    .hero-farewell {
      font-size: clamp(0.843rem, 2.107vw, 1.325rem);
      gap: calc(var(--hero-msg-word-gap) * 1.4);
    }
    .hero-line--large {
      font-size: clamp(1.792rem, 4.48vw, 2.816rem);
    }
    .hero-line .hero-line-word--name {
      font-size: 1em;
    }
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.03) 2px,
      rgba(0,0,0,0.03) 4px
    );
    pointer-events: none;
    z-index: 300;
  }
</style>
</head>
<body>

<canvas id="bg"></canvas>
<canvas id="laserCanvas"></canvas>
<div class="spotlight-glow" id="spotlightGlow"></div>
<div class="burst-overlay" id="burstOverlay"></div>
<div class="phase-name" id="phaseName"></div>
<div class="hero-line" id="heroLine"></div>
<div class="hero-farewell" id="heroFarewell" aria-hidden="true"></div>

<div id="welcomeScreen" class="welcome-screen">
  <div class="welcome-inner">
    <h1 class="welcome-title">Darling Hero</h1>
    <p class="welcome-prompt">What should I call you?</p>
    <input type="text" id="nameInput" class="name-input" placeholder="your nickname…" spellcheck="false" autocorrect="off" autocapitalize="off" autocomplete="off" autofocus>
    <button type="button" class="begin-btn" id="beginBtn"><span class="begin-note" aria-hidden="true">♪</span> Begin <span class="begin-mic" aria-hidden="true">🎤</span></button>
  </div>
</div>

<div class="app" id="mainApp">
  <div class="title-wrap" id="titleWrap">
    <h1>Darling Hero</h1>
  </div>

  <div class="input-row" id="inputRow">
    <div class="input-with-arrow">
      <textarea id="input" placeholder="Write your feeling… / きもちを書いて…" spellcheck="false" autocorrect="off" autocapitalize="off"></textarea>
      <span class="input-arrow">→</span>
    </div>
    <button class="release-btn" id="releaseBtn" onclick="release()">
      <span class="btn-mark">△</span>
      <span>release</span>
    </button>
  </div>
</div>

<script>
// ============================================================
// 八変化システム：8つの「相」（英語表示・AI判定）
// ============================================================
const PHASES = {
  ikari: {
    name: 'Anger',
    laserColors: [
      { core: '255,80,80', glow: '255,40,40' },
      { core: '255,40,140', glow: '200,0,80' },
      { core: '180,40,255', glow: '120,0,200' },
      { core: '255,200,40', glow: '255,140,0' }
    ],
    glowGradient: 'radial-gradient(circle, rgba(255,80,40,0.7) 0%, rgba(180,40,80,0.4) 30%, rgba(80,0,80,0.15) 60%, transparent 80%)',
    laserSpeedRange: [0.05, 0.10],
    laserDuration: 3500,
    laserCount: 40,
    burstSpeed: [1.2, 3.0],
    burstGravity: 0.04,
    burstUpward: false,
    glowColor: '#ff5040'
  },
  ai: {
    name: 'Sorrow',
    laserColors: [
      { core: '120,160,255', glow: '60,80,200' },
      { core: '180,200,255', glow: '100,140,220' },
      { core: '80,100,180', glow: '40,60,140' },
      { core: '200,220,255', glow: '150,180,230' }
    ],
    glowGradient: 'radial-gradient(circle, rgba(100,140,220,0.5) 0%, rgba(60,80,160,0.3) 30%, rgba(20,30,80,0.15) 60%, transparent 80%)',
    laserSpeedRange: [0.012, 0.025],
    laserDuration: 6500,
    laserCount: 28,
    burstSpeed: [0.3, 0.7],
    burstGravity: 0.05,
    burstUpward: false,
    glowColor: '#6080d0',
    swayFall: true
  },
  yorokobi: {
    name: 'Joy',
    laserColors: [
      { core: '255,240,150', glow: '255,200,80' },
      { core: '255,200,230', glow: '255,150,200' },
      { core: '255,255,200', glow: '255,220,150' },
      { core: '180,255,200', glow: '120,230,160' }
    ],
    glowGradient: 'radial-gradient(circle, rgba(255,240,150,0.7) 0%, rgba(255,200,180,0.4) 30%, rgba(255,160,180,0.15) 60%, transparent 80%)',
    laserSpeedRange: [0.03, 0.06],
    laserDuration: 4200,
    laserCount: 38,
    burstSpeed: [0.8, 2.0],
    burstGravity: -0.02,
    burstUpward: true,
    glowColor: '#ffd860',
    laceCurtain: true,
    burstCharScale: 0.8
  },
  shaa: {
    name: 'Gratitude',
    laserColors: [
      { core: '255,200,230', glow: '255,150,200' },
      { core: '255,255,255', glow: '255,220,240' },
      { core: '255,180,200', glow: '230,140,180' },
      { core: '255,230,250', glow: '255,200,230' }
    ],
    glowGradient: 'radial-gradient(circle, rgba(255,220,240,0.7) 0%, rgba(255,180,210,0.4) 30%, rgba(220,150,200,0.15) 60%, transparent 80%)',
    laserSpeedRange: [0.018, 0.035],
    laserDuration: 5000,
    laserCount: 32,
    burstSpeed: [0.5, 1.2],

/** See you again のフェイドアウト時間（従来 2000ms より +4s） */
const FAREWELL_FADE_OUT_MS = 6000;

function getFarewellSequenceMs() {
  const words = FAREWELL_MESSAGE.trim().split(/\s+/).filter(Boolean);
  const revealMs =
    words.length <= 1
      ? FAREWELL_WORD_FADE_MS
      : (words.length - 1) * FAREWELL_WORD_STAGGER_MS + FAREWELL_WORD_FADE_MS;
  return revealMs + FAREWELL_HOLD_MS + FAREWELL_FADE_OUT_MS;
}

const HERO_LINE_WORD_STAGGER_MS = 260;

let heroLineTimeouts = [];
let heroLineExitClearTimeout = null;

function clearHeroLineExitTimeout() {
  if (heroLineExitClearTimeout != null) {
    clearTimeout(heroLineExitClearTimeout);
    heroLineExitClearTimeout = null;
  }
}

function clearHeroLineTimers() {
  heroLineTimeouts.forEach(clearTimeout);
  heroLineTimeouts = [];
}

function appendHeroLineWordChunks(parent, text, wordSpans, isName = false) {
  const chunks = text.match(/\S+|\s+/g) || [];
  chunks.forEach(chunk => {
    if (/^\s+$/.test(chunk)) return;
    const span = document.createElement('span');
    span.className = isName
      ? 'hero-line-word hero-line-word--name'
      : 'hero-line-word';
    span.textContent = chunk;
    parent.appendChild(span);
    wordSpans.push(span);
  });
}

function startHeroLineWordReveal(el, fullText) {
  clearHeroLineTimers();
  el.innerHTML = '';
  el.style.transition = '';
  const isMobile = window.matchMedia('(max-width: 640px)').matches;
  const commaIdx = fullText.indexOf(', ');
  const wordSpans = [];
  const namePart = commaIdx !== -1 ? fullText.slice(0, commaIdx + 1) : '';
  const restPart = commaIdx !== -1 ? fullText.slice(commaIdx + 2) : fullText;

  if (isMobile && commaIdx !== -1) {
    el.classList.add('hero-line--stacked');
    const row1 = document.createElement('span');
    row1.className = 'hero-line-row';
    const row2 = document.createElement('span');
    row2.className = 'hero-line-row';
    el.appendChild(row1);
    el.appendChild(row2);
    appendHeroLineWordChunks(row1, namePart, wordSpans, true);
    appendHeroLineWordChunks(row2, restPart, wordSpans, false);
  } else {
    el.classList.remove('hero-line--stacked');
    appendHeroLineWordChunks(el, namePart, wordSpans, true);
    appendHeroLineWordChunks(el, restPart, wordSpans, false);
  }

  el.classList.add('show');
  wordSpans.forEach((span, i) => {
    const tid = setTimeout(() => {
      span.classList.add('is-visible');
    }, i * HERO_LINE_WORD_STAGGER_MS);
    heroLineTimeouts.push(tid);
  });
}

function normalizePhaseKey(raw) {
  if (raw == null || raw === '') return 'shizu';
  let s = String(raw).trim().toLowerCase().replace(/["'\u201c\u201d]/g, '');
  s = s.replace(/[\u3000]/g, ' ').replace(/\s+/g, ' ').trim();
  if (VALID_PHASE_KEYS.includes(s)) return s;
  const compact = s.replace(/\s+/g, '');
  if (VALID_PHASE_KEYS.includes(compact)) return compact;
  if (PHASE_ALIAS_TO_KEY[s]) return PHASE_ALIAS_TO_KEY[s];
  if (PHASE_ALIAS_TO_KEY[compact]) return PHASE_ALIAS_TO_KEY[compact];
  return 'shizu';
}

let cachedJudgment = null;
let cachedText = '';
let judgmentInProgress = false;

async function judgeEmotion(text) {
  try {
    const response = await fetch('/api/judge', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    console.log('[Darling Hero] judgeEmotion HTTP', { ok: response.ok, status: response.status });
    if (!response.ok) {
      const errBody = await response.text().catch(() => '');
      console.warn('[Darling Hero] judgeEmotion non-OK body', errBody.slice(0, 400));
      return 'shizu';
    }
    const data = await response.json();
    const key = normalizePhaseKey(data.phase);
    console.log('[Darling Hero] judgeEmotion response', { phaseRaw: data.phase, phaseKey: key });
    return key;
  } catch (e) {
    console.error('[Darling Hero] judgeEmotion error', e);
    return 'shizu';
  }
}

let judgmentTimer = null;
function scheduleJudgment(text) {
  if (judgmentTimer) clearTimeout(judgmentTimer);
  if (!text || text.trim().length < 2) {
    cachedJudgment = null;
    cachedText = '';
    return;
  }
  judgmentTimer = setTimeout(async () => {
    if (judgmentInProgress) return;
    judgmentInProgress = true;
    const result = await judgeEmotion(text);
    cachedJudgment = result;
    cachedText = text;
    judgmentInProgress = false;
  }, 800);
}

async function getPhaseForText(text, forceFresh = false) {
  if (forceFresh) {
    if (judgmentTimer) {
      clearTimeout(judgmentTimer);
      judgmentTimer = null;
    }
    if (judgmentInProgress) {
      for (let i = 0; i < 40; i++) {
        await new Promise(r => setTimeout(r, 100));
        if (!judgmentInProgress) break;
      }
    }
    cachedJudgment = null;
    cachedText = '';
    const key = await judgeEmotion(text);
    const phase = PHASES[key] || PHASES.shizu;
    console.log('[Darling Hero] getPhaseForText(forceFresh)', {
      textLen: text.length,
      textPreview: text.slice(0, 100),
      phaseKey: key,
      phaseName: phase.name
    });
    cachedJudgment = key;
    cachedText = text;
    return { phase, key };
  }
  if (cachedText === text && cachedJudgment) {
    const key = cachedJudgment;
    return { phase: PHASES[key] || PHASES.shizu, key };
  }
  if (judgmentInProgress) {
    for (let i = 0; i < 20; i++) {
      await new Promise(r => setTimeout(r, 100));
      if (!judgmentInProgress) break;
    }
    if (cachedText === text && cachedJudgment) {
      const key = cachedJudgment;
      return { phase: PHASES[key] || PHASES.shizu, key };
    }
  }
  const key = await judgeEmotion(text);
  return { phase: PHASES[key] || PHASES.shizu, key };
}

let mirrorBallBlend = 0;
let mirrorBallEaseIn = false;
let mirrorBallEaseOut = false;
let mirrorBallPhase = 0;

function beginMirrorBallBackgroundTransition() {
  mirrorBallEaseOut = false;
  mirrorBallEaseIn = true;
}

function endMirrorBallBackgroundTransition() {

  mirrorBallEaseOut = true;

function resetMirrorBallBackground() {

  mirrorBallPhase = 0;
}

/** 暗めシャボン玉＋控えめハイライト（メッセージの視認性を優先） */
const mirrorSoapBubbles = [];
for (let i = 0; i < 48; i++) {
  mirrorSoapBubbles.push({
    x: Math.random() * 2200 - 100,
    y: Math.random() * 1600 - 100,
    r: 18 + Math.random() * 72,
    vx: (Math.random() - 0.5) * 0.42,
    vy: (Math.random() - 0.48) * 0.36,
    hue: Math.random() * 360,
    wobble: Math.random() * Math.PI * 2,
    wobbleSpeed: 0.012 + Math.random() * 0.018
  });
}

function drawMirrorSoapBubbles(b) {
  if (b <= 0.001) return;
  const t = mirrorBallPhase;
  ctx.save();
  ctx.globalCompositeOperation = 'source-over';

  mirrorSoapBubbles.forEach((bb, idx) => {
    if (isLonelinessPhase && idx % 2 !== 0) return;
    bb.x += bb.vx;
    bb.y += bb.vy;
    bb.wobble += bb.wobbleSpeed;
    if (bb.x < -bb.r - 80) bb.x = W + bb.r + 40;
    if (bb.x > W + bb.r + 80) bb.x = -bb.r - 40;
    if (bb.y < -bb.r - 80) bb.y = H + bb.r + 40;
    if (bb.y > H + bb.r + 80) bb.y = -bb.r - 40;

    const cx = bb.x;
    const cy = bb.y;
    const pulse = 0.94 + 0.06 * Math.sin(bb.wobble);
    const R = bb.r * pulse;
    const bodyAlpha = b * (0.07 + 0.05 * Math.sin(bb.wobble * 1.1));

    const g = ctx.createRadialGradient(
      cx - R * 0.22,
      cy - R * 0.22,
      Math.max(2, R * 0.06),
      cx,
      cy,
      R
    );
    g.addColorStop(0, `rgba(55,52,78,${bodyAlpha * 1.1})`);
    g.addColorStop(0.35, `rgba(18,16,32,${bodyAlpha * 0.9})`);
    g.addColorStop(0.72, `rgba(12,10,26,${bodyAlpha * 0.55})`);
    g.addColorStop(1, 'rgba(5,5,10,0)');
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.fillStyle = g;
    ctx.fill();

    const hue = (bb.hue + t * 10) % 360;
    ctx.globalAlpha = b * (0.14 + 0.1 * Math.sin(bb.wobble * 1.7));
    ctx.strokeStyle = `hsla(${hue}, 28%, 48%, 0.22)`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(cx, cy, R * 0.97, 0, Math.PI * 2);
    ctx.stroke();

    const sx = cx - R * 0.28;
    const sy = cy - R * 0.3;
    ctx.globalAlpha = b * 0.1;
    const sg = ctx.createRadialGradient(sx, sy, 0, sx, sy, R * 0.28);
    sg.addColorStop(0, 'rgba(255,255,255,0.35)');
    sg.addColorStop(0.5, 'rgba(200,220,255,0.08)');
    sg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = sg;
    ctx.beginPath();
    ctx.arc(sx, sy, R * 0.26, 0, Math.PI * 2);
    ctx.fill();
  });

  ctx.restore();
}

function drawTriangle(cx, cy, size, rot) {
  ctx.beginPath();
  for (let i = 0; i < 3; i++) {
    const a = rot + (i / 3) * Math.PI * 2 - Math.PI / 2;
    const x = cx + Math.cos(a) * size;
    const y = cy + Math.sin(a) * size;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.closePath();
}

function loop() {
  requestAnimationFrame(loop);
  if (mirrorBallEaseIn) {
    mirrorBallBlend = Math.min(1, mirrorBallBlend + 0.0038);
  } else if (mirrorBallEaseOut) {
    mirrorBallBlend = Math.max(0, mirrorBallBlend - 0.0055);
    if (mirrorBallBlend <= 0) mirrorBallEaseOut = false;
  }
  mirrorBallPhase += 0.014;

  const mb = mirrorBallBlend;
  const skyMul = gratitudeScene.active ? (1 - gratitudeScene.skyAlpha * 0.92) : 1;
  const trailA = Math.max(0.15, 0.18 * (1 - mb * 0.9)) * (gratitudeScene.active ? Math.max(0.08, 1 - gratitudeScene.skyAlpha * 0.88) : 1);
  if (mb < 0.05) {
    const bgGrad = ctx.createLinearGradient(0, 0, W, H);
    bgGrad.addColorStop(0, `rgba(22, 48, 68, ${trailA * 0.92})`);
    bgGrad.addColorStop(0.45, `rgba(18, 38, 44, ${trailA})`);
    bgGrad.addColorStop(1, `rgba(24, 52, 46, ${trailA * 0.92})`);
    ctx.fillStyle = bgGrad;
  } else {
    ctx.fillStyle = `rgba(8,6,16,${trailA})`;
  }
  ctx.fillRect(0, 0, W, H);

  updateGratitudeScene();
  drawGratitudeSky();

  const lonelinessTriMul =
    lonelinessScene.active && lonelinessScene.alpha > 0
      ? Math.max(0, 1 - lonelinessScene.alpha * 1.4)
      : 1;
  const triMul = (1 - mb) * skyMul * lonelinessTriMul;
  triMarks.forEach(tr => {
    tr.x += tr.vx; tr.y += tr.vy; tr.rot += tr.vr;
    if (tr.x < -300) tr.x = W + 200;
    if (tr.x > W + 300) tr.x = -200;
    if (tr.y < -300) tr.y = H + 200;
    if (tr.y > H + 300) tr.y = -200;
    const sx = tr.x, sy = tr.y, s = tr.size;
    const shadowOff = s * 0.08;
    ctx.save();
    ctx.globalAlpha = tr.alpha * triMul;
    drawTriangle(sx + shadowOff, sy + shadowOff, s, tr.rot);
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fill();
    ctx.globalAlpha = tr.alpha * triMul;
    drawTriangle(sx, sy, s, tr.rot);
    const g = ctx.createLinearGradient(sx - s, sy - s, sx + s, sy + s);
    g.addColorStop(0, tr.color);
    g.addColorStop(0.4, tr.color);
    g.addColorStop(0.72, 'rgba(168, 210, 228, 0.22)');
    g.addColorStop(1, 'rgba(184, 205, 178, 0.14)');
    ctx.fillStyle = g;
    ctx.fill();
    ctx.restore();
  });

  let bubbleBlend = mb;
  if (gratitudeScene.active && gratitudeScene.bubbleAlpha > 0.001) {
    bubbleBlend = Math.max(mb, gratitudeScene.bubbleAlpha * 0.82);
  }
  drawMirrorSoapBubbles(bubbleBlend);
  drawGratitudeContrails();

  heroSparkles = heroSparkles.filter(s => s.life > 0);
  heroSparkles.forEach(s => {
    s.x += s.vx; s.y += s.vy;
    s.vy += s.gravity;
    s.vx *= 0.99;
    s.life -= 1;
    s.rot += s.vRot;
    const a = Math.min(1, s.life / 400);
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.rot);
    ctx.beginPath();
    ctx.arc(0, 0, s.size, 0, Math.PI * 2);
    ctx.fillStyle = s.color.replace(/[\d.]+\)$/, `${a})`);
    ctx.shadowColor = s.color;
    ctx.shadowBlur = 28;
    ctx.fill();
    ctx.restore();
  });

  burstCharSpans = burstCharSpans.filter(b => {
    if (b.life <= 0) {
      if (b.el && b.el.parentNode) b.el.remove();
      return false;
    }
    return true;
  });
  burstCharSpans.forEach(b => {
    if (b.swayFall) {
      b.swayTime++;
      b.x = b.baseX + b.swayAmp * Math.sin(b.swayTime * b.swayFreq + b.swayPhase);
      b.y += b.vy;
      b.vy += b.gravity;
    } else if (b.circular) {
      b.angle += b.angleSpeed;
      b.radius += b.radiusSpeed;
      b.x = b.cx + Math.cos(b.angle) * b.radius;
      b.y = b.cy + Math.sin(b.angle) * b.radius;
    } else if (b.phase === 'up') {
      b.vy -= b.upForce;
      b.x += b.vx;
      b.y += b.vy;
      b.vx *= 0.99;
    } else {
      b.x += b.vx;
      b.y += b.vy;
      b.vy += b.gravity;
      if (b.upwardEnabled && b.life < b.maxLife - 60) {
        b.phase = 'up';
        b.vy = -0.5 - Math.random() * 0.5;
      }
    }
    b.rot += b.vRot;
    b.life -= 1;
    const a = Math.min(1, b.life / 400);
    if (b.el && b.el.parentNode) {
      b.el.style.left = b.x + 'px';
      b.el.style.top = b.y + 'px';
      b.el.style.transform = `translate(-50%, -50%) rotate(${b.rot}deg) scale(${0.7 + a * 0.3})`;
      b.el.style.opacity = a;
    }
  });

  heroBrightness *= 0.995;
}

let joyLaceCurtains = [];
let joyLaceTime = 0;

function startJoyLaceCurtains() {
  joyLaceCurtains = [];
  joyLaceTime = 0;
  const W = laserCanvas.width;
  const H = laserCanvas.height;
  const count = 4;
  const lineW = W * 0.045;
  for (let i = 0; i < count; i++) {
    const centerX = W * (0.2 + i * 0.2);
    joyLaceCurtains.push({
      baseX: centerX - lineW * 0.5,
      width: lineW,
      dropY: -H * (0.18 + Math.random() * 0.08),
      wavePhase: Math.random() * Math.PI * 2,
      waveSpeed: 0.004 + Math.random() * 0.003,
      swayAmp: 11 + Math.random() * 9,
      hueBase: 265 + i * 48 + Math.random() * 12,
      alpha: 0,
      fadeOut: false
    });
  }
}

function fadeJoyLaceCurtains() {
  joyLaceCurtains.forEach(c => { c.fadeOut = true; });
}

function drawJoyLacePanel(ctx, panel, time, H) {
  const alpha = panel.alpha;
  if (alpha <= 0) return;

  const pW = panel.width;
  const pX = panel.baseX;
  const dropOff = panel.dropY;
  const curtainH = H * 1.1;
  const segs = 30;
  const leftEdge = [];
  const rightEdge = [];

  for (let i = 0; i <= segs; i++) {
    const t = i / segs;
    const y = dropOff + t * curtainH;
    const puff = Math.pow(t, 1.2);
    const slow = time * panel.waveSpeed;
    const w1 = Math.sin(t * Math.PI * 1.35 + panel.wavePhase + slow) * panel.swayAmp * puff;
    const w2 = Math.sin(t * Math.PI * 0.75 + panel.wavePhase * 0.65 + slow * 0.55) * panel.swayAmp * 0.38 * puff;
    const wave = w1 + w2;
    leftEdge.push({ x: pX + wave, y });
    rightEdge.push({ x: pX + pW + wave * 0.92, y });
  }

  ctx.beginPath();
  ctx.moveTo(leftEdge[0].x, leftEdge[0].y);
  leftEdge.forEach(p => ctx.lineTo(p.x, p.y));
  for (let i = rightEdge.length - 1; i >= 0; i--) ctx.lineTo(rightEdge[i].x, rightEdge[i].y);
  ctx.closePath();

  const hBase = panel.hueBase;
  const sat = 72;
  const lit = 64;
  const fillA = alpha * 0.18;

  ctx.save();
  ctx.fillStyle = `hsla(${hBase % 360}, ${sat}%, ${lit}%, ${fillA})`;
  ctx.shadowBlur = 0;
  ctx.fill();
  ctx.clip();

  ctx.restore();
}

    { r: 35,  g: 58,  b: 140 }, // 青（暗め）
    { r: 170, g: 100, b: 230 }, // 紫
    { r: 38,  g: 95,  b: 72  }, // 緑（暗め）
    { r: 240, g: 235, b: 155 }, // 淡い黄
    { r: 240, g: 185, b: 215 }, // 淡いピンク
  ];
  // 曲線上に配置（二次ベジェ：左上 → カーブ → 右下）
  const p0 = { x: W * 0.08, y: H * 0.12 };
  const p1 = { x: W * 0.40 + (Math.random() - 0.5) * W * 0.14, y: H * 0.50 + (Math.random() - 0.5) * H * 0.10 };
  const p2 = { x: W * 0.88, y: H * 0.84 };
  lonelinessScene.moons = [];
  let t = 0;
  moonColors.forEach((col, i) => {
    if (i > 0) t += 0.13 + Math.random() * 0.22;
    t = Math.min(1, t);
    const x = (1 - t) * (1 - t) * p0.x + 2 * (1 - t) * t * p1.x + t * t * p2.x;
    const y = (1 - t) * (1 - t) * p0.y + 2 * (1 - t) * t * p1.y + t * t * p2.y;
    lonelinessScene.moons.push({
      x: x + (Math.random() - 0.5) * 40,
      y: y + (Math.random() - 0.5) * 32,
      r: 38,
      col
    });
  });
  lonelinessScene.active = true;
  lonelinessScene.alpha = 0;
  lonelinessScene.fadeOut = false;
  isLonelinessPhase = true;
}

function stopLonelinessScene() {
  lonelinessScene.fadeOut = true;
  isLonelinessPhase = false;
}

function resetLonelinessScene() {

  lonelinessScene.alpha = 0;
  lonelinessScene.fadeOut = false;
  lonelinessScene.moons = [];
  isLonelinessPhase = false;
}

// Gratitude 青空・飛行機雲システム（shaa フェーズ専用）

let isGratitudePhase = false;
let gratitudeScene = {
  active: false,
  fadeOut: false,
  bubbleAlpha: 0,
  skyAlpha: 0,
  contrails: []
};

function startGratitudeScene() {
  const W = window.innerWidth;
  const H = window.innerHeight;
  gratitudeScene.contrails = [];
  for (let i = 0; i < 5; i++) {
    const speed = 0.30 + Math.random() * 0.40;
    const angle = Math.PI * 0.22 + (Math.random() - 0.5) * 0.08;
    gratitudeScene.contrails.push({
      x: Math.random() * W * 1.2 - W * 0.25,
      y: Math.random() * H * 0.55 - H * 0.08,
      len: 160 + Math.random() * 200,
      thick: 7 + Math.random() * 12,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      angle,
      alpha: 0.14 + Math.random() * 0.14
    });
  }
  gratitudeScene.active = true;
  gratitudeScene.fadeOut = false;
  gratitudeScene.bubbleAlpha = 1;
  gratitudeScene.skyAlpha = 0;
  isGratitudePhase = true;
}

function stopGratitudeScene() {
  gratitudeScene.fadeOut = true;
  isGratitudePhase = false;
}

function resetGratitudeScene() {
  gratitudeScene.active = false;
  gratitudeScene.fadeOut = false;
  gratitudeScene.bubbleAlpha = 0;
  gratitudeScene.skyAlpha = 0;
  gratitudeScene.contrails = [];
  isGratitudePhase = false;
}

function updateGratitudeScene() {
  if (!gratitudeScene.active) return;
  if (gratitudeScene.fadeOut) {
    gratitudeScene.skyAlpha = Math.max(0, gratitudeScene.skyAlpha - 0.006);
    gratitudeScene.bubbleAlpha = Math.max(0, gratitudeScene.bubbleAlpha - 0.008);
    if (gratitudeScene.skyAlpha <= 0 && gratitudeScene.bubbleAlpha <= 0) {
      gratitudeScene.active = false;
    }
    return;
  }
  gratitudeScene.bubbleAlpha = Math.max(0, gratitudeScene.bubbleAlpha - 0.0038);
  gratitudeScene.skyAlpha = Math.min(1, gratitudeScene.skyAlpha + 0.0045);
}

function drawGratitudeSky() {
  if (!gratitudeScene.active || gratitudeScene.skyAlpha <= 0.01) return;
  const a = gratitudeScene.skyAlpha;
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
  skyGrad.addColorStop(0,    `rgba(90,  165, 245, ${a * 0.92})`);
  skyGrad.addColorStop(0.45, `rgba(145, 200, 255, ${a * 0.88})`);
  skyGrad.addColorStop(0.78, `rgba(195, 228, 255, ${a * 0.82})`);
  skyGrad.addColorStop(1,    `rgba(230, 245, 255, ${a * 0.75})`);
  ctx.save();
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

function drawGratitudeContrails() {
  if (!gratitudeScene.active || gratitudeScene.skyAlpha <= 0.05) return;
  ctx.save();
  gratitudeScene.contrails.forEach(c => {
    c.x += c.vx;
    c.y += c.vy;
    if (c.x > W + c.len || c.y > H + c.thick * 2) {
      c.x = -c.len - Math.random() * W * 0.3;
      c.y = -c.thick * 2 - Math.random() * H * 0.25;
    }
    const a = c.alpha * gratitudeScene.skyAlpha;
    ctx.save();
    ctx.translate(c.x + c.len * 0.5, c.y);
    ctx.rotate(c.angle);
    ctx.globalAlpha = a;
    ctx.filter = 'blur(10px)';
    ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
    ctx.beginPath();
    ctx.ellipse(0, 0, c.len * 0.5, c.thick, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.filter = 'blur(5px)';
    ctx.globalAlpha = a * 0.6;
    ctx.beginPath();
    ctx.ellipse(-c.len * 0.15, c.thick * 0.25, c.len * 0.28, c.thick * 0.55, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });
  ctx.restore();
}

// ============================================================
// レーザーシステム
// ============================================================
const laserCanvas = document.getElementById('laserCanvas');
const laserCtx = laserCanvas.getContext('2d');

function resizeLaser() {
  laserCanvas.width = window.innerWidth;
  laserCanvas.height = window.innerHeight;
}
resizeLaser();
window.addEventListener('resize', resizeLaser);

let lasers = [];
let laserRainbowHue = 0;

function spawnLaser(phase) {
  const cx = laserCanvas.width / 2;
  const cy = laserCanvas.height / 2;
  const angle = Math.random() * Math.PI * 2;
  const distance = Math.max(laserCanvas.width, laserCanvas.height) * 0.7;
  const startX = cx + Math.cos(angle) * distance;
  const startY = cy + Math.sin(angle) * distance;
  const targetX = cx + (Math.random() - 0.5) * 200;
  const targetY = cy + (Math.random() - 0.5) * 100;
  const colorIdx = Math.floor(Math.random() * phase.laserColors.length);
  const color = phase.laserColors[colorIdx];
  const [minSpeed, maxSpeed] = phase.laserSpeedRange;

  laserRainbowHue = (laserRainbowHue + 47) % 360;

  lasers.push({
    sx: startX, sy: startY,
    tx: targetX, ty: targetY,
    progress: 0,
    speed: minSpeed + Math.random() * (maxSpeed - minSpeed),
    thickness: 0.8 + Math.random() * 1.5,
    life: 80,
    maxLife: 80,
    color: color,
    rainbowHue: laserRainbowHue,
    isArrow: !!phase.arrowBeam,
    fadeStart: false
  });
}

let laserBurstActive = false;
function startLaserBurst(phase) {
  if (laserBurstActive) return;
  laserBurstActive = true;
  const interval = phase.laserDuration / phase.laserCount;
  let count = 0;
  const fire = () => {
    if (count >= phase.laserCount) {
      laserBurstActive = false;
      return;
    }
    const burstSize = 1 + Math.floor(Math.random() * 2);
    for (let i = 0; i < burstSize; i++) spawnLaser(phase);
    count += burstSize;
    const nextDelay = interval * (0.5 + Math.random() * 1.2);
    setTimeout(fire, nextDelay);
  };
  fire();
}

function drawLasers() {
  laserCtx.clearRect(0, 0, laserCanvas.width, laserCanvas.height);
  lasers = lasers.filter(l => l.life > 0);

  lasers.forEach(l => {
    if (l.progress < 1) {
      l.progress += l.speed;
      if (l.progress >= 1) {
        l.progress = 1;
        l.fadeStart = true;
      }
    } else {
      l.life -= 4;
    }

    const headX = l.sx + (l.tx - l.sx) * l.progress;
    const headY = l.sy + (l.ty - l.sy) * l.progress;
    const tailLength = 0.35;
    const tailProgress = Math.max(0, l.progress - tailLength);
    const tailX = l.sx + (l.tx - l.sx) * tailProgress;
    const tailY = l.sy + (l.ty - l.sy) * tailProgress;
    const lifeAlpha = l.fadeStart ? l.life / l.maxLife : 1;

    const rh = l.rainbowHue;
    const rh1 = (rh + 50) % 360;
    const rh2 = (rh + 100) % 360;
    const rh3 = (rh + 160) % 360;

    // Layer 1: wide outer glow — hue shifts along beam for iridescence
    const glowGrad = laserCtx.createLinearGradient(tailX, tailY, headX, headY);
    glowGrad.addColorStop(0,    `hsla(${rh},100%,62%,0)`);
    glowGrad.addColorStop(0.25, `hsla(${rh1},100%,65%,${0.22 * lifeAlpha})`);
    glowGrad.addColorStop(0.6,  `hsla(${rh2},100%,68%,${0.38 * lifeAlpha})`);
    glowGrad.addColorStop(1,    `hsla(${rh3},100%,72%,${0.88 * lifeAlpha})`);

    laserCtx.save();
    laserCtx.shadowColor = `hsla(${rh},100%,65%,${0.9 * lifeAlpha})`;
    laserCtx.shadowBlur = 28;
    laserCtx.strokeStyle = glowGrad;
    laserCtx.lineWidth = l.thickness * 3.8;
    laserCtx.lineCap = 'round';
    laserCtx.beginPath();
    laserCtx.moveTo(tailX, tailY);
    laserCtx.lineTo(headX, headY);
    laserCtx.stroke();
    laserCtx.restore();

    // Layer 2: mid shimmer — brighter, shifted hues for pearlescent look
    const shimmerGrad = laserCtx.createLinearGradient(tailX, tailY, headX, headY);
    shimmerGrad.addColorStop(0,    `hsla(${rh1},100%,78%,0)`);
    shimmerGrad.addColorStop(0.3,  `hsla(${rh2},100%,83%,${0.55 * lifeAlpha})`);
    shimmerGrad.addColorStop(0.65, `hsla(${rh3},100%,87%,${0.72 * lifeAlpha})`);
    shimmerGrad.addColorStop(1,    `hsla(${(rh+20)%360},100%,92%,${0.96 * lifeAlpha})`);

    laserCtx.save();
    laserCtx.strokeStyle = shimmerGrad;
    laserCtx.lineWidth = l.thickness * 1.8;
    laserCtx.lineCap = 'round';
    laserCtx.beginPath();
    laserCtx.moveTo(tailX, tailY);
    laserCtx.lineTo(headX, headY);
    laserCtx.stroke();
    laserCtx.restore();

    // Layer 3: white core for glossy sharpness
    laserCtx.save();
    laserCtx.strokeStyle = `rgba(255,255,255,${0.92 * lifeAlpha})`;
    laserCtx.lineWidth = l.thickness * 0.5;
    laserCtx.lineCap = 'round';
    laserCtx.beginPath();
    laserCtx.moveTo(tailX, tailY);
    laserCtx.lineTo(headX, headY);
    laserCtx.stroke();
    laserCtx.restore();

    // Arrow head + heart for arrow beams (love / joy)
    if (l.isArrow && l.progress > 0.06) {
      const arrowAngle = Math.atan2(l.ty - l.sy, l.tx - l.sx);
      const arrowSize = Math.max(11, l.thickness * 5 + 8);
      const tipX = headX + Math.cos(arrowAngle) * arrowSize;
      const tipY = headY + Math.sin(arrowAngle) * arrowSize;

      // Arrowhead triangle
      laserCtx.save();
      laserCtx.shadowColor = `hsla(${rh},100%,70%,${lifeAlpha})`;
      laserCtx.shadowBlur = 18;
      laserCtx.fillStyle = `hsla(${rh1},100%,82%,${0.96 * lifeAlpha})`;
      laserCtx.beginPath();
      laserCtx.moveTo(tipX, tipY);
      laserCtx.lineTo(
        headX + Math.cos(arrowAngle + Math.PI * 0.72) * arrowSize * 0.74,
        headY + Math.sin(arrowAngle + Math.PI * 0.72) * arrowSize * 0.74
      );
      laserCtx.lineTo(
        headX + Math.cos(arrowAngle - Math.PI * 0.72) * arrowSize * 0.74,
        headY + Math.sin(arrowAngle - Math.PI * 0.72) * arrowSize * 0.74
      );
      laserCtx.closePath();
      laserCtx.fill();
      laserCtx.restore();

      // ♡ at the very tip — large, glowing heart
      const heartSize = Math.max(28, arrowSize * 2.2);
      const heartX = tipX + Math.cos(arrowAngle) * heartSize * 0.5;
      const heartY = tipY + Math.sin(arrowAngle) * heartSize * 0.5;
      // outer glow pass
      laserCtx.save();
      laserCtx.font = `bold ${heartSize}px sans-serif`;
      laserCtx.textAlign = 'center';
      laserCtx.textBaseline = 'middle';
      laserCtx.shadowColor = `rgba(255, 80, 140, ${lifeAlpha})`;
      laserCtx.shadowBlur = 32;
      laserCtx.fillStyle = `rgba(255, 80, 140, ${0.55 * lifeAlpha})`;
      laserCtx.fillText('♡', heartX, heartY);
      laserCtx.restore();
      // bright core pass
      laserCtx.save();
      laserCtx.font = `bold ${heartSize}px sans-serif`;
      laserCtx.textAlign = 'center';
      laserCtx.textBaseline = 'middle';
      laserCtx.shadowColor = `rgba(255, 200, 220, ${lifeAlpha})`;
      laserCtx.shadowBlur = 18;
      laserCtx.fillStyle = `rgba(255, 230, 240, ${0.98 * lifeAlpha})`;
      laserCtx.fillText('♡', heartX, heartY);
      laserCtx.restore();
    }

    if (l.progress >= 1 && l.life > l.maxLife - 20) {
      const flashAlpha = (l.life - (l.maxLife - 20)) / 20;
      if (l.isArrow) {
        // ♡ bloom at impact
        const bloomSize = Math.max(40, l.thickness * 12 + 20) * (1 + (1 - flashAlpha) * 1.2);
        laserCtx.save();
        laserCtx.font = `bold ${bloomSize}px sans-serif`;
        laserCtx.textAlign = 'center';
        laserCtx.textBaseline = 'middle';
        laserCtx.shadowColor = `rgba(255, 80, 140, ${flashAlpha})`;
        laserCtx.shadowBlur = 40;
        laserCtx.fillStyle = `rgba(255, 80, 140, ${0.6 * flashAlpha})`;
        laserCtx.fillText('♡', headX, headY);
        laserCtx.restore();
        laserCtx.save();
        laserCtx.font = `bold ${bloomSize}px sans-serif`;
        laserCtx.textAlign = 'center';
        laserCtx.textBaseline = 'middle';
        laserCtx.shadowColor = `rgba(255, 220, 235, ${flashAlpha})`;
        laserCtx.shadowBlur = 20;
        laserCtx.fillStyle = `rgba(255, 240, 248, ${flashAlpha})`;
        laserCtx.fillText('♡', headX, headY);
        laserCtx.restore();
      } else {
        laserCtx.save();
        const flashGrad = laserCtx.createRadialGradient(headX, headY, 0, headX, headY, 30);
        flashGrad.addColorStop(0,    `rgba(255,255,255,${0.95 * flashAlpha})`);
        flashGrad.addColorStop(0.25, `hsla(${rh},100%,80%,${0.75 * flashAlpha})`);
        flashGrad.addColorStop(0.55, `hsla(${rh1},100%,68%,${0.4 * flashAlpha})`);
        flashGrad.addColorStop(1,    `hsla(${rh2},100%,60%,0)`);
        laserCtx.shadowColor = `hsla(${rh},100%,72%,${flashAlpha})`;
        laserCtx.shadowBlur = 22;
        laserCtx.fillStyle = flashGrad;
        laserCtx.beginPath();
        laserCtx.arc(headX, headY, 30, 0, Math.PI * 2);
        laserCtx.fill();
        laserCtx.restore();
      }
    }
  });

  // ── Sorrow 小鳥の更新・描画（sorrow 以外では sorrowBirds が空なので何もしない）──
  if (sorrowBirds.length > 0) {
    sorrowBirds.forEach(b => {
      b.alpha = b.fadeOut
        ? Math.max(0, b.alpha - 0.010)
        : Math.min(0.80, b.alpha + 0.016);

      // 前フレームの位置を保存（向き計算用）
      b.prevX = b.x;
      b.prevY = b.y;

      // 螺旋の中心が文字の約半分の速度で落下
      b.vy += b.gravity;
      b.cy += b.vy;

      // 螺旋角度を進める → 実座標を計算
      b.spiralAngle += b.spiralSpeed;
      b.x = b.cx + Math.cos(b.spiralAngle) * b.spiralRadius;
      b.y = b.cy + Math.sin(b.spiralAngle) * b.spiralRadius * 0.48;

      b.wingPhase += b.wingSpeed;
            b.wingGrow = Math.min(1, b.wingGrow + 0.012);

      if (b.alpha <= 0) return;

      // 移動方向で鳥の向きを決める
      const dx = b.x - b.prevX;
      const dy = b.y - b.prevY;
      const spd = Math.sqrt(dx * dx + dy * dy);
      const angle = spd > 0.01 ? Math.atan2(dy, dx) : 0;
      // 羽ばたき量・翼幅（0.6倍に短縮）
      const wingDrop = Math.sin(b.wingPhase) * b.size * 0.9;
      const W = b.size * 1.2;   // 2.0 × 0.6 = 1.2

      laserCtx.save();
      laserCtx.translate(b.x, b.y);
      laserCtx.rotate(angle);
      laserCtx.globalAlpha = b.alpha;
      laserCtx.shadowColor = `rgba(${b.shadowColor}, 0.9)`;
      laserCtx.shadowBlur  = 14;
      laserCtx.strokeStyle = `rgba(${b.strokeColor}, ${b.alpha})`;
      laserCtx.lineWidth   = 2.2;
      laserCtx.lineCap     = 'round';
      laserCtx.lineJoin    = 'round';

      // 左翼（平面・直線）
      laserCtx.beginPath();
      laserCtx.moveTo(0, 0);
      laserCtx.lineTo(-W, -wingDrop);
      laserCtx.stroke();

      // 右翼（平面・直線）
      laserCtx.beginPath();
      laserCtx.moveTo(0, 0);
      laserCtx.lineTo(W, -wingDrop);
      laserCtx.stroke();

      // 胴体（小さな楕円）
      laserCtx.beginPath();
      laserCtx.ellipse(0, 0, b.size * 0.28, b.size * 0.18, 0, 0, Math.PI * 2);
      laserCtx.fillStyle = `rgba(${b.fillColor}, ${b.alpha * 0.7})`;
      laserCtx.fill();

      // 尾羽（短い線）
      laserCtx.beginPath();
      laserCtx.moveTo(-b.size * 0.18, 0);
      laserCtx.lineTo(-b.size * 0.55, b.size * 0.22);
      laserCtx.stroke();

      laserCtx.restore();
    });
    // フェードアウト完了した鳥を除去
    sorrowBirds = sorrowBirds.filter(b => !(b.fadeOut && b.alpha <= 0));
  }

  // ── Hope 花びら（nozomi 以外では hopePetals が空なので何もしない）──
  if (hopePetals.length > 0) {
    const CW = laserCanvas.width;
    const CH = laserCanvas.height;
    hopePetals.forEach(p => {
      if (p.startDelay > 0) { p.startDelay--; return; }

      p.alpha = p.fadeOut
        ? Math.max(0, p.alpha - 0.007)
        : Math.min(0.88, p.alpha + 0.022);

      p.swayTime++;
      p.vx = Math.sin(p.swayTime * p.swayFreq) * p.swayAmp;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vRot;

      // 画面外に出たらループ
      if (p.x < -20)      p.x = CW + 20;
      if (p.x > CW + 20)  p.x = -20;
      if (p.y < -20)      p.y = CH + 20;

      if (p.alpha <= 0) return;

      laserCtx.save();
      laserCtx.translate(p.x, p.y);
      laserCtx.rotate(p.rot);
      laserCtx.globalAlpha = p.alpha;
      laserCtx.shadowColor = `rgba(${p.r}, ${p.g}, ${p.b}, 0.65)`;
      laserCtx.shadowBlur  = 9;
      laserCtx.fillStyle   = `rgba(${p.r}, ${p.g}, ${p.b}, ${p.alpha})`;

      // 薔薇の花弁形：上部が尖り、中央が膨らみ、基部に小さな切れ込み
      const s = p.size;
      laserCtx.beginPath();
      laserCtx.moveTo(0, -s);                                                        // 先端（上）
      laserCtx.bezierCurveTo( s * 1.1, -s * 0.3,  s * 0.9,  s * 0.65,  s * 0.15,  s * 0.95); // 右辺
      laserCtx.quadraticCurveTo(0, s * 0.72, -s * 0.15, s * 0.95);                  // 基部の切れ込み
      laserCtx.bezierCurveTo(-s * 0.9,  s * 0.65, -s * 1.1, -s * 0.3,  0, -s);     // 左辺
      laserCtx.closePath();
      laserCtx.fill();
      laserCtx.restore();
    });
    hopePetals = hopePetals.filter(p => !(p.fadeOut && p.alpha <= 0));
  }

  // ── Joy レースカーテン（yorokobi 以外では joyLaceCurtains が空なので何もしない）──
  if (joyLaceCurtains.length > 0) {
    joyLaceTime += 0.007;
    const H = laserCanvas.height;
    joyLaceCurtains.forEach(c => {
      c.alpha = c.fadeOut
        ? Math.max(0, c.alpha - 0.01)
        : Math.min(0.38, c.alpha + 0.018);

      if (!c.fadeOut && c.dropY < 0) {
        c.dropY += 1.8;
        if (c.dropY > 0) c.dropY = 0;
      }

      c.wavePhase += c.waveSpeed * 0.18;

      if (c.alpha <= 0) return;
      drawJoyLacePanel(laserCtx, c, joyLaceTime, H);
    });
    joyLaceCurtains = joyLaceCurtains.filter(c => !(c.fadeOut && c.alpha <= 0));
  }

  // ── Loneliness の月（sabishii 以外では active=false なので何もしない）──
  if (lonelinessScene.active) {
    lonelinessScene.alpha = lonelinessScene.fadeOut
      ? Math.max(0, lonelinessScene.alpha - 0.005)
      : Math.min(0.68, lonelinessScene.alpha + 0.007);

    if (lonelinessScene.alpha > 0) {
      lonelinessScene.moons.forEach(m => {
        laserCtx.save();
        laserCtx.globalAlpha = lonelinessScene.alpha;
        // 外側のぼんやりとした光暈
        laserCtx.filter = 'blur(14px)';
        laserCtx.beginPath();
        laserCtx.arc(m.x, m.y, m.r * 1.6, 0, Math.PI * 2);
        laserCtx.fillStyle = `rgba(${m.col.r},${m.col.g},${m.col.b},0.35)`;
        laserCtx.fill();
        // 月本体（ぼかし小さめ）
        laserCtx.filter = 'blur(7px)';
        laserCtx.beginPath();
        laserCtx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
        laserCtx.fillStyle = `rgba(${m.col.r},${m.col.g},${m.col.b},0.88)`;
        laserCtx.fill();
        laserCtx.restore();
      });
    }
    if (lonelinessScene.fadeOut && lonelinessScene.alpha <= 0) {
      lonelinessScene.active = false;
    }
  }

  requestAnimationFrame(drawLasers);
}
drawLasers();
loop();

// ============================================================
// 文字飛散
// ============================================================
function applyBurstCharScale(span, phase) {
  const scale = phase.burstCharScale ?? 0.8;
  span.style.fontSize = `${2.24 * scale}rem`;
}

function spawnHeroBurst(text, phase) {
  const overlay = document.getElementById('burstOverlay');
  overlay.innerHTML = '';
  const screenCx = window.innerWidth / 2;
  const screenCy = window.innerHeight / 2;
  const chars = Array.from(text);

  if (phase.swayFall) {
    if (phase.name === 'Sorrow') spawnSorrowBirds();
    if (phase.name === 'Weariness') spawnSorrowBirds({
      stroke: '90, 170, 100',   // 暗めの緑
      shadow: '60, 140, 70',
      fill:   '130, 200, 140'
    });
    const screenW = window.innerWidth;
    const slower = !!phase.swaySlower;
    chars.forEach((char, idx) => {
      if (char.trim() === '') return;
      const bx = screenCx + (Math.random() - 0.5) * screenW * 0.65;
      const by = screenCy * 0.28 + Math.random() * screenCy * 0.38;
      const span = document.createElement('span');
      span.className = 'burst-char';
      span.textContent = char;
      span.style.left = bx + 'px';
      span.style.top = by + 'px';
      span.style.transform = 'translate(-50%, -50%)';
      const colorIdx = idx % phase.laserColors.length;
      const c = phase.laserColors[colorIdx];
      const colorStr = `rgb(${c.core})`;
      span.style.color = colorStr;
      span.style.textShadow = `0 0 20px ${colorStr}, 0 0 40px ${colorStr}`;
      applyBurstCharScale(span, phase);
      overlay.appendChild(span);
      const maxLife = slower ? 1900 + Math.random() * 1100 : 1300 + Math.random() * 700;
      burstCharSpans.push({
        el: span,
        x: bx, y: by,
        baseX: bx,
        swayFall: true,
        swayTime: Math.random() * 200,
        swayAmp:  slower ? 24 + Math.random() * 32  : 38 + Math.random() * 52,
        swayFreq: slower ? 0.009 + Math.random() * 0.010 : 0.015 + Math.random() * 0.018,
        swayPhase: Math.random() * Math.PI * 2,
        vy:      slower ? 0.10 + Math.random() * 0.18 : 0.28 + Math.random() * 0.65,
        gravity: slower ? 0.0015 + Math.random() * 0.0025 : 0.005 + Math.random() * 0.009,
        rot:  (Math.random() - 0.5) * (slower ? 10 : 18),
        vRot: (Math.random() - 0.5) * (slower ? 0.18 : 0.35),
        life: maxLife,
        maxLife: maxLife
      });
    });
    return;
  }

  const [minSpeed, maxSpeed] = phase.burstSpeed;

  chars.forEach((char, idx) => {
    if (char.trim() === '') return;
    const span = document.createElement('span');
    span.className = 'burst-char';
    span.textContent = char;
    span.style.left = screenCx + 'px';
    span.style.top = screenCy + 'px';
    span.style.transform = 'translate(-50%, -50%)';
    const colorIdx = idx % phase.laserColors.length;
    const c = phase.laserColors[colorIdx];
    const colorStr = `rgb(${c.core})`;
    span.style.color = colorStr;
    span.style.textShadow = `0 0 20px ${colorStr}, 0 0 40px ${colorStr}`;
    applyBurstCharScale(span, phase);
    overlay.appendChild(span);

    const angle = Math.random() * Math.PI * 2;
    const speed = minSpeed + Math.random() * (maxSpeed - minSpeed);
    const maxLife = 1100 + Math.random() * 300;

    const charObj = {
      el: span,
      x: screenCx, y: screenCy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 0.2,
      rot: (Math.random() - 0.5) * 60,
      vRot: (Math.random() - 0.5) * 3,
      life: maxLife,
      maxLife: maxLife,
      gravity: phase.burstGravity,
      phase: 'spread',
      upwardEnabled: phase.burstUpward,
      upForce: 0.015
    };

    if (phase.burstCircular) {
      charObj.circular = true;
      charObj.cx = screenCx;
      charObj.cy = screenCy;
      charObj.angle = (idx / chars.length) * Math.PI * 2;
      charObj.angleSpeed = 0.015 + Math.random() * 0.01;
      charObj.radius = 20;
      charObj.radiusSpeed = 1.2 + Math.random() * 0.5;
    }

    burstCharSpans.push(charObj);
  });
}

function spawnHeroSparkles(cx, cy, count, phase) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 5;
    const colorIdx = Math.floor(Math.random() * phase.laserColors.length);
    const c = phase.laserColors[colorIdx];
    heroSparkles.push({
      x: cx, y: cy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - (phase.burstUpward ? 1.5 : 0.5),
      size: 1.5 + Math.random() * 3,
      life: 300 + Math.random() * 200,
      color: `rgba(${c.core}, 1)`,
      rot: 0,
      vRot: (Math.random() - 0.5) * 0.2,
      gravity: phase.burstUpward ? -0.01 : 0.02
    });
  }
}

// ============================================================
// RELEASE
// ============================================================
async function release() {
  const inputEl = document.getElementById('input');
  const releaseBtn = document.getElementById('releaseBtn');
  const text = inputEl.value.trim();
  if (!text) {
    inputEl.focus();
    return;
  }

  const rect = inputEl.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;

  clearFarewellTimers();
  clearHeroLineTimers();
  clearHeroLineExitTimeout();
  resetMirrorBallBackground();
  const heroFarewellEl = document.getElementById('heroFarewell');
  const heroLineEl = document.getElementById('heroLine');
  heroFarewellEl.innerHTML = '';
  heroFarewellEl.style.opacity = '0';
  heroFarewellEl.style.transition = 'none';
  heroFarewellEl.style.color = 'transparent';
  heroLineEl.classList.remove('show');
  heroLineEl.style.transition = '';
  heroLineEl.innerHTML = '';

  const inputRowEl = document.getElementById('inputRow');
  const inputArrowEl = inputRowEl.querySelector('.input-arrow');
  inputRowEl.classList.remove('input-row--hidden');

  // 入力ロック
  inputEl.disabled = true;
  inputEl.placeholder = '';
  releaseBtn.disabled = true;
  releaseBtn.classList.remove('release-btn--hidden-cinematic');
  if (inputArrowEl) inputArrowEl.classList.remove('input-arrow--hidden-cinematic');
  if (inputArrowEl) inputArrowEl.classList.add('input-arrow--hidden-cinematic');
  inputEl.blur();

  document.getElementById('titleWrap').classList.add('is-hidden');

  // 相を取得（release 時はキャッシュを使わず必ず API 判定）
  const { phase, key: phaseKey } = await getPhaseForText(text, true);
  const lineFn = HERO_LINE_BY_PHASE[phaseKey] || HERO_LINE_BY_PHASE.shizu;
  console.log('[Darling Hero] release heroLine', { phaseKey, lineSample: lineFn(userName).slice(0, 80) });

  // 入力欄クリア
  inputEl.value = '';

  // 中央グロー
  const spotlightGlow = document.getElementById('spotlightGlow');
  spotlightGlow.style.background = phase.glowGradient;
  spotlightGlow.classList.add('show');

  // 相の名前を表示
  const phaseNameEl = document.getElementById('phaseName');
  phaseNameEl.textContent = phase.name;
  phaseNameEl.style.color = phase.glowColor;
  phaseNameEl.classList.toggle('phase-name--sorrow', phase.name === 'Sorrow');
  setTimeout(() => phaseNameEl.classList.add('show'), 200);

  // レーザー発射（swayFall・petalBurst・skyScene・laceCurtain 以外）
  if (!phase.swayFall && !phase.petalBurst && !phase.skyScene && !phase.laceCurtain) startLaserBurst(phase);

  // 文字飛散
  setTimeout(() => {
    spawnHeroBurst(text, phase);
    if (phase.petalBurst) spawnHopePetals();
    if (phase.laceCurtain) startJoyLaceCurtains();
    if (!phase.swayFall && !phase.petalBurst && !phase.skyScene && !phase.laceCurtain) spawnHeroSparkles(window.innerWidth / 2, window.innerHeight / 2, 80, phase);
    heroBrightness = 0.5;
  }, Math.min(2200, phase.laserDuration * 0.45));

  if (phase.skyScene) startGratitudeScene();

  // 最後の一行を表示（演出が落ち着いた頃）
  const heroLineText = lineFn(userName.toLowerCase());
  const heroLineShowAt = phase.laserDuration + 800;
  const isNavyPhase  = phase.name === 'Sorrow';
  const isGreenPhase = phase.name === 'Weariness';
  const isPinkPhase  = phase.name === 'Love';
  const isLoneliness = phase.name === 'Loneliness';
  const isGratitude  = phase.name === 'Gratitude';
  if (isLoneliness) startLonelinessScene();
  setTimeout(() => {
    releaseBtn.classList.add('release-btn--hidden-cinematic');
    if (!isGratitude) beginMirrorBallBackgroundTransition();
    heroLineEl.classList.toggle('hero-line--navy',  isNavyPhase);
    heroLineEl.classList.toggle('hero-line--green', isGreenPhase);
    heroLineEl.classList.toggle('hero-line--pink',  isPinkPhase);
    heroLineEl.classList.toggle('hero-line--dark-blue', isGratitude);
    heroLineEl.classList.toggle('hero-line--loneliness-navy', isLoneliness);
    heroLineEl.classList.toggle('hero-line--large', isLoneliness);
    startHeroLineWordReveal(heroLineEl, heroLineText);
  }, heroLineShowAt);

  setTimeout(() => {
    heroFarewellEl.classList.toggle('hero-farewell--navy',  isNavyPhase);
    heroFarewellEl.classList.toggle('hero-farewell--green', isGreenPhase);
    heroFarewellEl.classList.toggle('hero-farewell--pink',  isPinkPhase);
    heroFarewellEl.classList.toggle('hero-farewell--dark-blue', isGratitude);
    heroFarewellEl.classList.toggle('hero-farewell--loneliness-navy', isLoneliness);
  }, heroLineShowAt + 5000);

  setTimeout(() => scheduleHeroFarewell(heroFarewellEl), heroLineShowAt + 5000);

  const farewellSequenceMs = getFarewellSequenceMs();
  const farewellEnd = heroLineShowAt + 5000 + farewellSequenceMs;
  const totalDuration = Math.max(phase.laserDuration + 4500, farewellEnd + 400);

  // フェードアウト
  setTimeout(() => {
    fadeSorrowBirds();
    fadeHopePetals();
    fadeJoyLaceCurtains();
    stopLonelinessScene();
    stopGratitudeScene();
    spotlightGlow.classList.remove('show');
    phaseNameEl.classList.remove('show');
    clearHeroLineTimers();
    const exitSec = HERO_LINE_EXIT_DURATION_MS / 1000;
    heroLineEl.style.transition = `transform ${exitSec}s ease, opacity ${exitSec}s ease`;
    heroLineEl.classList.remove('show');

    clearHeroLineExitTimeout();
    heroLineExitClearTimeout = setTimeout(() => {
      heroLineExitClearTimeout = null;
      heroLineEl.innerHTML = '';
      heroLineEl.style.transition = '';
      heroLineEl.classList.remove('hero-line--stacked');
      heroLineEl.classList.remove('hero-line--navy');
      heroLineEl.classList.remove('hero-line--green');
      heroLineEl.classList.remove('hero-line--pink');
      heroLineEl.classList.remove('hero-line--dark-blue');
      heroLineEl.classList.remove('hero-line--loneliness-navy');
      heroLineEl.classList.remove('hero-line--large');
      heroFarewellEl.classList.remove('hero-farewell--navy');
      heroFarewellEl.classList.remove('hero-farewell--green');
      heroFarewellEl.classList.remove('hero-farewell--pink');
      heroFarewellEl.classList.remove('hero-farewell--dark-blue');
      heroFarewellEl.classList.remove('hero-farewell--loneliness-navy');
    }, HERO_LINE_EXIT_DURATION_MS);

    clearFarewellTimers();
    heroFarewellEl.innerHTML = '';
    heroFarewellEl.style.transition = 'opacity 0.6s ease';
    heroFarewellEl.style.opacity = '0';
    heroFarewellEl.style.color = 'transparent';

    document.getElementById('inputRow').classList.add('input-row--hidden');
  }, totalDuration);

  const silenceEndAt =
    totalDuration + HERO_LINE_EXIT_DURATION_MS + POST_FAREWELL_SILENCE_MS;
  setTimeout(() => {
    document.getElementById('inputRow').classList.remove('input-row--hidden');
    document.getElementById('releaseBtn').classList.remove('release-btn--hidden-cinematic');
    const ia = document.querySelector('.input-arrow');
    if (ia) ia.classList.remove('input-arrow--hidden-cinematic');
  }, silenceEndAt);

  const inputReadyAt = silenceEndAt + INPUT_UI_FADE_IN_MS + 150;
  setTimeout(() => {
    endMirrorBallBackgroundTransition();
    inputEl.disabled = false;
    inputEl.placeholder = 'Write your feeling… / きもちを書いて…';
    releaseBtn.disabled = false;
    document.getElementById('titleWrap').classList.remove('is-hidden');
    cachedJudgment = null;
    cachedText = '';
    sorrowBirds = [];
    hopePetals = [];
    joyLaceCurtains = [];
    resetLonelinessScene();
    resetGratitudeScene();
  }, inputReadyAt);
}

// 入力中に裏で判定をスケジュール
const inputElement = document.getElementById('input');
inputElement.addEventListener('input', (e) => {
  scheduleJudgment(e.target.value.trim());
});

inputElement.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    release();
  }
});

const nameInputEl = document.getElementById('nameInput');
const beginBtn = document.getElementById('beginBtn');
beginBtn.addEventListener('click', beginMainExperience);
nameInputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    beginMainExperience();
  }
});

setTimeout(() => { if (nameInputEl) nameInputEl.focus(); }, 120);
</script>
